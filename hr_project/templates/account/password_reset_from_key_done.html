{% extends 'base.html' %}
{% block title %}변경 완료 · MEGA HR{% endblock %}

{% block content %}
<style>
    aside, nav, .sidebar, .left-menu, .nav-bar { display: none !important; }
    body { background-color: #f4f5f7 !important; }
    .auth-wrapper { 
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #f4f5f7;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
        z-index: 9999;
        overflow-y: auto;
    }
    .auth-card { width: 100%; max-width: 400px; padding: 50px 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .icon-box { font-size: 48px; margin-bottom: 20px; }
    .auth-title { font-size: 22px; font-weight: 800; margin-bottom: 15px; color: #333; }
    .auth-desc { font-size: 15px; color: #666; margin-bottom: 30px; }
    .auth-btn { display: block; width: 100%; padding: 15px; background: #2962ff; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; text-decoration: none; transition: 0.3s; box-sizing: border-box; }
    .auth-btn:hover { background: #1e4bd8; transform: translateY(-1px); color: white; }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="icon-box">🎉</div>
        <h2 class="auth-title">변경 완료!</h2>
        <p class="auth-desc">비밀번호가 성공적으로 변경되었습니다.<br>새로운 비밀번호로 로그인해 주세요.</p>
        <a href="{% url 'account_login' %}" class="auth-btn">로그인하러 가기</a>
    </div>
</div>
{% endblock %}
