{% extends 'base.html' %}
{% block title %}비밀번호 재설정 · Mega Coffee HR{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="auth-card" style="text-align: center; padding: 40px 20px;">
        <h2 class="auth-title" style="margin-bottom: 20px;">비밀번호 재설정</h2>
        <p style="margin-bottom: 20px; color: #555;">가입하신 이메일 주소를 입력해 주세요.<br>비밀번호 재설정 링크를 보내드립니다.</p>
        
        <form method="POST" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-btn">재설정 메일 보내기</button>
        </form>
    </div>
</div>
{% endblock %}
