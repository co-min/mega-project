{% extends 'base.html' %}
{% block title %}메일 발송 완료 · MEGA HR{% endblock %}

{% block content %}
<style>
    aside, nav, .sidebar, .left-menu, .nav-bar { display: none !important; }
    body { background-color: #f4f5f7 !important; }
    .auth-wrapper { 
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #f4f5f7;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
        z-index: 9999;
        overflow-y: auto;
    }
    .auth-card { width: 100%; max-width: 400px; padding: 50px 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .icon-box { font-size: 48px; margin-bottom: 20px; }
    .auth-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; color: #333; }
    .auth-desc { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 0; }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="icon-box">✉️</div>
        <h2 class="auth-title">메일 발송 완료</h2>
        <p class="auth-desc">비밀번호 재설정 링크가 포함된<br>메일을 발송했습니다.<br><strong>메일함을 확인해 주세요.</strong></p>
    </div>
</div>
{% endblock %}
