{% extends 'base.html' %}
{% block title %}새 비밀번호 설정 · MEGA HR{% endblock %}

{% block content %}
<style>
    aside, nav, .sidebar, .left-menu, .nav-bar { display: none !important; }
    body { background-color: #f4f5f7 !important; }
    .auth-wrapper { 
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #f4f5f7;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
        z-index: 9999;
        overflow-y: auto;
    }
    .auth-card { width: 100%; max-width: 400px; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
    .auth-logo { font-size: 24px; font-weight: 900; color: #222; margin-bottom: 20px; }
    .auth-logo span { color: #2962ff; }
    .auth-title { font-size: 18px; font-weight: 800; margin-bottom: 25px; color: #333; }
    
    .auth-card p { text-align: left; font-size: 13px; font-weight: 700; color: #555; margin-bottom: 5px; }
    .auth-input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 20px; font-size: 14px; box-sizing: border-box; transition: 0.2s; }
    .auth-input:focus { border-color: #2962ff; outline: none; box-shadow: 0 0 0 3px rgba(41, 98, 255, 0.1); }
    .auth-btn { width: 100%; padding: 15px; background: #2962ff; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.3s; }
    .auth-btn:hover { background: #1e4bd8; transform: translateY(-1px); }
    .error-msg { background: #fef2f2; color: #ef4444; padding: 15px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo"><span>MEGA</span> HR</div>
        <h2 class="auth-title">새 비밀번호 입력</h2>
        
        {% if token_fail %}
            <div class="error-msg">⚠️ 유효하지 않거나 이미 만료된 링크입니다.</div>
        {% else %}
            <form method="POST" action="{{ action_url }}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="auth-btn">비밀번호 변경하기</button>
            </form>
        {% endif %}
    </div>
</div>

<script>
    document.querySelectorAll('.auth-card input').forEach(input => {
        if(input.type !== 'hidden') input.classList.add('auth-input');
    });
</script>
{% endblock %}
