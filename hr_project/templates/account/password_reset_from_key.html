{% extends 'base.html' %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="auth-card" style="text-align: center; padding: 40px 20px;">
        <h2 class="auth-title" style="margin-bottom: 20px;">새 비밀번호 입력</h2>
        
        {% if token_fail %}
            <p style="color: red;">유효하지 않거나 이미 만료된 링크입니다.</p>
        {% else %}
            <form method="POST" action="{{ action_url }}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="auth-btn">비밀번호 변경하기</button>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
